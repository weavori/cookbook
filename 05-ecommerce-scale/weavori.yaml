# Recipe 05: how the data should look.
# Product SKUs/names and customer countries come from your own value sets;
# emails and slugs are derived. Everything else is the semantic matcher.

generate:
  datasets:
    products: products.csv
    countries: countries.csv

  tables:
    categories:
      columns:
        slug:
          formula: "lower(replace(name, ' ', '-'))"

    products:
      columns:
        sku:
          dataset: products
          dataset_column: sku
        name:
          dataset: products
          dataset_column: name

    customers:
      columns:
        country:
          dataset: countries
        email:
          formula: "lower(concat(first_name, '.', last_name, '@example.com'))"
